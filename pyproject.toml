[project]
name = "resultkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "iceoryx2>=0.9.1",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch>=2.12.0",
    "pycuda",
]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ipython>=9.13.0",
    "pynvvideocodec>=2.1.0",
    "pytest>=9.0.3",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.51",
    "glfw>=2.10.0",
    "redis>=8.0.0",
    "depthai>=3.7.1",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "timm>=1.0.27",
    "imageio>=2.37.3",
    "omegaconf>=2.3.1",
    "triton-windows>=3.7.1.post27",
    "supervision>=0.29.1",
    "gdown>=6.1.0",
    "lightning>=2.6.5",
    "nanodet",
    "shapely>=2.1.2",
    "fsspec>=2026.4.0",
    "paramiko>=5.0.0",
    "cupy>=14.2.0",
]

[tool.uv.sources]
torch = { index = "torch-cuda" }
torchvision = { index = "torch-cuda" }
pycuda = { path = "./pycuda" }
nanodet = { path = "../nanodet/dist/nanodet-1.0.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["resultkit*"]

[tool.uv]
package = true
