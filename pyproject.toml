[project]
name = "resultkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "iceoryx2>=0.9.1",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ipython>=9.13.0",
    "pynvvideocodec>=2.1.0",
    "pytest>=9.0.3",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.51",
]

[tool.uv.sources]
torch = { index = "torch-cuda" }
torchvision = { index = "torch-cuda" }

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
